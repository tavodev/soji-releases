<!doctype html>
<html lang="es">
<head>

    body { color: #f5f5f7; }
    .sub { color: #98989d; }
  }
</style>
</head>
<body>
  <h1>Soji 1.3.3</h1>

  <ul>

    <li>Incluye también las mejoras de seguridad y rendimiento de Soji 1.3.2.</li>
  </ul>

</html>
